name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (for stylua/selene)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (stylua/selene)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-tools-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install plenary.nvim
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/vendor/start
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim \
            ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim

      - name: Install nvim-treesitter + SQL parser
        run: |
          git clone --depth 1 https://github.com/nvim-treesitter/nvim-treesitter \
            ~/.local/share/nvim/site/pack/vendor/start/nvim-treesitter
          nvim --headless -c "TSInstallSync sql" -c "qa"

      - name: Run tests
        run: |
          nvim --headless \
            -c "PlenaryBustedDirectory tests/ {minimal_init='tests/minimal_init.lua'}" \
            -c "qa"

      - name: Install stylua + selene
        run: |
          (command -v stylua >/dev/null 2>&1 && echo "stylua already installed") || cargo install stylua --locked --force
          (command -v selene  >/dev/null 2>&1 && echo "selene already installed") || cargo install selene --locked --force

      - name: Lint (selene)
        continue-on-error: true
        run: |
          selene lua/

      - name: Format check (stylua)
        continue-on-error: true
        run: |
          stylua --check lua/ tests/
